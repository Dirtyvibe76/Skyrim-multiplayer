name: Build SkyrimMP Client Package

on:
  workflow_dispatch:
  push:
    branches:
      - re-0.1-runtime-probe
    paths:
      - 'ClientPlugin/**'
      - 'Shared/**'
      - 'Server/**'
      - 'ClientPackage/**'
      - 'ClientLauncher/**'
      - 'Installer/**'
      - 'Docs/PLAYABLE_ALPHA_TEST.md'
      - 'External/**'
      - 'xmake.lua'
      - '.gitmodules'
      - '.github/workflows/build-client-package.yml'

jobs:
  build-client:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest

      - name: Configure
        shell: cmd
        run: xmake f -m releasedbg -a x64 -y

      - name: Verify shared alpha identity
        shell: powershell
        run: |
          $expectedVersion = '0.1.0-alpha.4'
          $expectedWire = '2'
          $expectedReplication = '9'
          $files = @('Shared\BuildInfo.h', 'ClientLauncher\BuildInfo.cs', 'Installer\SkyrimMP.iss', 'ClientPackage\README.txt')
          foreach ($file in $files) {
            $text = Get-Content $file -Raw
            if (-not $text.Contains($expectedVersion)) { throw "$file does not contain version $expectedVersion" }
          }
          foreach ($file in @('Shared\BuildInfo.h', 'ClientLauncher\BuildInfo.cs', 'ClientPackage\README.txt')) {
            $text = Get-Content $file -Raw
            if (-not $text.Contains($expectedWire) -or -not $text.Contains($expectedReplication)) {
              throw "$file does not contain the expected protocol identity"
            }
          }

      - name: Build client DLL
        shell: cmd
        run: xmake build -vD SkyrimMultiplayer

      - name: Build dedicated server
        shell: cmd
        run: xmake build -vD SkyrimMPServer

      - name: Build standalone launcher EXE
        shell: powershell
        run: dotnet publish ClientLauncher\SkyrimMPLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o launcher-publish

      - name: Stage client package
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'artifact\SkyrimMultiplayer-Client'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build\windows\x64\releasedbg\SkyrimMultiplayer.dll' $stage
          Copy-Item 'launcher-publish\SkyrimMPLauncher.exe' $stage
          Copy-Item 'ClientPackage\README.txt' $stage
          Copy-Item 'Docs\PLAYABLE_ALPHA_TEST.md' $stage
          Get-FileHash (Join-Path $stage 'SkyrimMultiplayer.dll') -Algorithm SHA256 |
            ForEach-Object { "SkyrimMultiplayer.dll SHA256=$($_.Hash)" } |
            Set-Content (Join-Path $stage 'SHA256.txt')
          Get-FileHash (Join-Path $stage 'SkyrimMPLauncher.exe') -Algorithm SHA256 |
            ForEach-Object { "SkyrimMPLauncher.exe SHA256=$($_.Hash)" } |
            Add-Content (Join-Path $stage 'SHA256.txt')

      - name: Upload downloadable client package
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimMultiplayer-Client
          path: artifact/SkyrimMultiplayer-Client
          if-no-files-found: error
          retention-days: 30

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' 'Installer\SkyrimMP.iss'
          if (-not (Test-Path 'release\SkyrimMP-0.1.0-alpha.4-Setup.exe')) { throw 'SkyrimMP installer was not produced.' }
          Get-FileHash 'release\SkyrimMP-0.1.0-alpha.4-Setup.exe' -Algorithm SHA256 |
            ForEach-Object { "SkyrimMP-0.1.0-alpha.4-Setup.exe SHA256=$($_.Hash)" } |
            Set-Content 'release\SkyrimMP-0.1.0-alpha.4-Setup.SHA256.txt'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimMP-Setup
          path: |
            release/SkyrimMP-0.1.0-alpha.4-Setup.exe
            release/SkyrimMP-0.1.0-alpha.4-Setup.SHA256.txt
          if-no-files-found: error
          retention-days: 30

      - name: Stage dedicated server package
        shell: powershell
        run: |
          $stage = Join-Path $PWD 'artifact\SkyrimMultiplayer-Server'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'build\windows\x64\releasedbg\SkyrimMPServer.exe' $stage
          Copy-Item 'Server\server.ini.example' $stage
          Copy-Item 'README.md' $stage
          Copy-Item 'Docs\PLAYABLE_ALPHA_TEST.md' $stage
          Get-FileHash (Join-Path $stage 'SkyrimMPServer.exe') -Algorithm SHA256 |
            ForEach-Object { "SkyrimMPServer.exe SHA256=$($_.Hash)" } |
            Set-Content (Join-Path $stage 'SHA256.txt')

      - name: Upload downloadable server package
        uses: actions/upload-artifact@v4
        with:
          name: SkyrimMultiplayer-Server
          path: artifact/SkyrimMultiplayer-Server
          if-no-files-found: error
          retention-days: 30
